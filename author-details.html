<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Profile - BookMart</title>
  <meta name="description" content="View author profile, biography, and published books on BookMart.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>

  <main class="main-content">
    <div class="container">
      <!-- Author Profile Container -->
      <div id="author-profile-container"></div>

      <!-- Author's Books Section -->
      <div style="margin-top: 2rem;">
        <h2 style="margin-bottom: 1.5rem;">Books by this Author</h2>
        <div class="books-grid" id="author-books-container">
          <!-- Dynamic Author Books Loaded Here -->
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { renderAuthorDetailPage } from "/js/authors.js";

    const urlParams = new URLSearchParams(window.location.search);
    const authorId = urlParams.get("id") || "auth-martin";

    renderAuthorDetailPage(authorId);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - BookMart</title>
  <meta name="description" content="Set a new password for your BookMart customer account.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>New Password</h2>
          <p>Choose a strong new password for your account</p>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label for="new-password" class="form-label">New Password</label>
            <input type="password" id="new-password" class="form-input" placeholder="Minimum 6 characters" required>
          </div>

          <div class="form-group">
            <label for="confirm-new-password" class="form-label">Confirm New Password</label>
            <input type="password" id="confirm-new-password" class="form-input" placeholder="Repeat new password" required>
          </div>

          <button type="submit" id="reset-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:1rem;">
            Update Password
          </button>
        </form>

        <div class="auth-footer">
          <a href="/login.html">Back to Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { resetPasswordWithCode } from "/js/auth.js";
    import { showToast } from "/js/utils.js";

    const urlParams = new URLSearchParams(window.location.search);
    const oobCode = urlParams.get("oobCode");

    const form = document.getElementById("reset-form");
    const btn = document.getElementById("reset-btn");

    if (!oobCode) {
      showToast("Invalid password reset link.", "error");
    }

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!oobCode) {
        showToast("Missing password reset verification code.", "error");
        return;
      }

      const newPassword = document.getElementById("new-password").value;
      const confirmPassword = document.getElementById("confirm-new-password").value;

      if (newPassword !== confirmPassword) {
        showToast("Passwords do not match!", "warning");
        return;
      }

      if (newPassword.length < 6) {
        showToast("Password must be at least 6 characters long.", "warning");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span>Updating password...</span>`;

      try {
        await resetPasswordWithCode(oobCode, newPassword);
        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1200);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Update Password`;
      }
    });
  </script>
</body>
</html>

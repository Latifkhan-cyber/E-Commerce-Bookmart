<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - BookMart</title>
  <meta name="description" content="Reset your BookMart password using your registered email address.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Reset Password</h2>
          <p>Enter your email to receive a password reset link</p>
        </div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="forgot-email" class="form-label">Email Address</label>
            <input type="email" id="forgot-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <button type="submit" id="forgot-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:1rem;">
            Send Reset Link
          </button>
        </form>

        <div class="auth-footer">
          Remembered your password? <a href="/login.html">Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { sendPasswordReset } from "/js/auth.js";

    const form = document.getElementById("forgot-form");
    const btn = document.getElementById("forgot-btn");

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("forgot-email").value;

      btn.disabled = true;
      btn.innerHTML = `<span>Sending email...</span>`;

      try {
        await sendPasswordReset(email);
        btn.innerHTML = `Link Sent! Check Inbox`;
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `Send Reset Link`;
      }
    });
  </script>
</body>
</html>

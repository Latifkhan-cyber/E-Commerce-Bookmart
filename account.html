<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - BookMart</title>
  <meta name="description" content="Manage your BookMart profile, addresses, orders, and security settings.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/account.css">
  <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>

  <main class="main-content">
    <div class="container">
      
      <!-- Account Dashboard Layout -->
      <div class="account-layout">
        
        <!-- Left Sidebar -->
        <aside class="account-sidebar">
          <div class="user-profile-summary">
            <img id="profile-summary-avatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="profile-avatar">
            <h3 id="profile-summary-name" style="font-size:1.15rem;margin-bottom:0.25rem;">Loading...</h3>
            <div id="profile-summary-email" style="font-size:0.85rem;color:var(--text-muted);">user@example.com</div>
          </div>

          <div class="account-nav">
            <a href="#overview" class="account-nav-item active">📊 Overview</a>
            <a href="#profile" class="account-nav-item">👤 Profile Details</a>
            <a href="#addresses" class="account-nav-item">📍 Saved Addresses</a>
            <a href="/orders.html" class="account-nav-item">📦 My Orders</a>
            <a href="/wishlist.html" class="account-nav-item">❤️ My Wishlist</a>
          </div>
        </aside>

        <!-- Right Main Panel -->
        <div>
          <!-- Stats Summary Grid -->
          <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:1rem;margin-bottom:2.5rem;">
            <div style="background:var(--card-bg);border:1px solid var(--card-border);padding:1.25rem;border-radius:var(--radius-lg);text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Total Orders</div>
              <div id="stat-total-orders" style="font-size:1.6rem;font-weight:800;color:var(--primary-color);">0</div>
            </div>
            
            <div style="background:var(--card-bg);border:1px solid var(--card-border);padding:1.25rem;border-radius:var(--radius-lg);text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Pending Orders</div>
              <div id="stat-pending-orders" style="font-size:1.6rem;font-weight:800;color:var(--warning-color);">0</div>
            </div>

            <div style="background:var(--card-bg);border:1px solid var(--card-border);padding:1.25rem;border-radius:var(--radius-lg);text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Completed</div>
              <div id="stat-completed-orders" style="font-size:1.6rem;font-weight:800;color:var(--accent-color);">0</div>
            </div>

            <div style="background:var(--card-bg);border:1px solid var(--card-border);padding:1.25rem;border-radius:var(--radius-lg);text-align:center;">
              <div style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.25rem;">Saved Wishlist</div>
              <div id="stat-wishlist-count" style="font-size:1.6rem;font-weight:800;color:var(--danger-color);">0</div>
            </div>
          </div>

          <!-- Profile Details Section -->
          <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;">
            <h3 style="margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border-light);">Personal Profile Information</h3>
            <form id="profile-edit-form">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                  <label for="acc-name" class="form-label">Full Name</label>
                  <input type="text" id="acc-name" class="form-input" required>
                </div>
                <div class="form-group">
                  <label for="acc-phone" class="form-label">Phone Number</label>
                  <input type="tel" id="acc-phone" class="form-input" placeholder="+1 (555) 000-0000">
                </div>
              </div>

              <div class="form-group">
                <label for="acc-email" class="form-label">Email Address</label>
                <input type="email" id="acc-email" class="form-input" disabled style="opacity:0.7;">
              </div>

              <button type="submit" class="btn btn-primary">Save Profile Changes</button>
            </form>
          </div>

          <!-- Change Password Section -->
          <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:2rem;margin-bottom:2rem;">
            <h3 style="margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border-light);">Security & Password</h3>
            <form id="change-password-form">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                  <label for="new-acc-pwd" class="form-label">New Password</label>
                  <input type="password" id="new-acc-pwd" class="form-input" placeholder="Minimum 6 characters" required>
                </div>
                <div class="form-group">
                  <label for="confirm-acc-pwd" class="form-label">Confirm New Password</label>
                  <input type="password" id="confirm-acc-pwd" class="form-input" placeholder="Repeat new password" required>
                </div>
              </div>
              <button type="submit" class="btn btn-outline">Update Password</button>
            </form>
          </div>

          <!-- Saved Addresses Section -->
          <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:2rem;">
            <h3 style="margin-bottom:1.5rem;padding-bottom:0.75rem;border-bottom:1px solid var(--border-light);">Saved Shipping Addresses</h3>
            
            <div id="account-addresses-list" class="address-grid" style="margin-bottom:2rem;">
              <!-- Rendered via JS -->
            </div>

            <!-- Add Address Sub-Form -->
            <h4 style="margin-bottom:1rem;">Add New Address</h4>
            <form id="add-address-form">
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
                <div class="form-group">
                  <label for="addr-name" class="form-label">Full Name</label>
                  <input type="text" id="addr-name" class="form-input" required>
                </div>
                <div class="form-group">
                  <label for="addr-phone" class="form-label">Phone Number</label>
                  <input type="tel" id="addr-phone" class="form-input" required>
                </div>
              </div>

              <div class="form-group">
                <label for="addr-street" class="form-label">Street Address</label>
                <input type="text" id="addr-street" class="form-input" required>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
                <div class="form-group">
                  <label for="addr-city" class="form-label">City</label>
                  <input type="text" id="addr-city" class="form-input" required>
                </div>
                <div class="form-group">
                  <label for="addr-province" class="form-label">State / Province</label>
                  <input type="text" id="addr-province" class="form-input" required>
                </div>
                <div class="form-group">
                  <label for="addr-postal" class="form-label">Postal Code</label>
                  <input type="text" id="addr-postal" class="form-input" required>
                </div>
              </div>

              <div class="form-group" style="display:flex;align-items:center;gap:0.5rem;">
                <input type="checkbox" id="addr-default">
                <label for="addr-default" style="font-size:0.9rem;cursor:pointer;">Set as default shipping address</label>
              </div>

              <button type="submit" class="btn btn-sm btn-primary">Save Address</button>
            </form>
          </div>

        </div>

      </div>

    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { AccountDashboard } from "/js/profile.js";
    window.accountDashboard = new AccountDashboard();
    window.accountDashboard.init();
  </script>
</body>
</html>

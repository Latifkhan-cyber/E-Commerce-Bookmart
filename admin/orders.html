<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders Management - BookMart</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">📚 Book<span>Mart</span> Admin</div>
      <ul class="admin-menu-list">
        <li><a href="/admin/index.html" class="admin-menu-item">📊 Dashboard</a></li>
        <li><a href="/admin/books.html" class="admin-menu-item">📖 Books Catalog</a></li>
        <li><a href="/admin/orders.html" class="admin-menu-item active">📦 Customer Orders</a></li>
        <li><a href="/admin/customers.html" class="admin-menu-item">👥 Customer Accounts</a></li>
        <li><a href="/admin/inventory.html" class="admin-menu-item">⚠️ Stock Inventory</a></li>
        <li><a href="/admin/coupons.html" class="admin-menu-item">🏷️ Promo Coupons</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-top-bar">
        <div>
          <h1 style="font-size:1.8rem;margin-bottom:0.25rem;">Customer Orders Management</h1>
          <p style="color:var(--text-muted);">View, filter, update statuses, or manage customer deliveries.</p>
        </div>

        <div style="display:flex;align-items:center;gap:0.75rem;">
          <label for="admin-order-status-filter" style="font-weight:600;font-size:0.9rem;">Filter Status:</label>
          <select id="admin-order-status-filter" class="form-select" style="width:auto;">
            <option value="all">All Orders</option>
            <option value="Pending">Pending</option>
            <option value="Confirmed">Confirmed</option>
            <option value="Processing">Processing</option>
            <option value="Shipped">Shipped</option>
            <option value="Delivered">Delivered</option>
            <option value="Cancelled">Cancelled</option>
          </select>
        </div>
      </div>

      <div class="data-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Date</th>
              <th>Total</th>
              <th>Payment Status</th>
              <th>Order Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="admin-orders-table-body">
            <!-- Rendered dynamically by js/admin/orders.js -->
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/admin/admin-auth.js"></script>

  <script type="module">
    import { renderAdminOrdersTable } from "/js/admin/orders.js";

    renderAdminOrdersTable();

    document.getElementById("admin-order-status-filter")?.addEventListener("change", (e) => {
      renderAdminOrdersTable(e.target.value);
    });
  </script>
</body>
</html>

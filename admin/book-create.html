<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Book - BookMart Admin</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">📚 Book<span>Mart</span> Admin</div>
      <ul class="admin-menu-list">
        <li><a href="/admin/index.html" class="admin-menu-item">📊 Dashboard</a></li>
        <li><a href="/admin/books.html" class="admin-menu-item active">📖 Books Catalog</a></li>
        <li><a href="/admin/categories.html" class="admin-menu-item">📂 Categories</a></li>
        <li><a href="/admin/authors.html" class="admin-menu-item">✍️ Authors</a></li>
        <li><a href="/admin/publishers.html" class="admin-menu-item">🏢 Publishers</a></li>
        <li><a href="/admin/orders.html" class="admin-menu-item">📦 Customer Orders</a></li>
        <li><a href="/admin/customers.html" class="admin-menu-item">👥 Customer Accounts</a></li>
        <li><a href="/admin/inventory.html" class="admin-menu-item">⚠️ Stock Inventory</a></li>
        <li><a href="/admin/coupons.html" class="admin-menu-item">🏷️ Promo Coupons</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-top-bar">
        <div>
          <h1 style="font-size:1.8rem;margin-bottom:0.25rem;">Add New Book</h1>
          <p style="color:var(--text-muted);">Fill in all book details to publish to the store catalog.</p>
        </div>
        <a href="/admin/books.html" class="btn btn-outline">← Back to Books</a>
      </div>

      <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:2.5rem;max-width:800px;">
        <form id="admin-book-form">
          <div class="form-group">
            <label for="book-title" class="form-label">Book Title *</label>
            <input type="text" id="book-title" class="form-input" placeholder="e.g. Clean Code" required>
          </div>

          <div class="form-group">
            <label for="book-description" class="form-label">Description *</label>
            <textarea id="book-description" class="form-textarea" rows="4" placeholder="Detailed book synopsis and description..." required></textarea>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="book-author" class="form-label">Author *</label>
              <select id="book-author" class="form-select" required>
                <option value="auth-martin|Robert C. Martin">Robert C. Martin</option>
                <option value="auth-fowler|Martin Fowler">Martin Fowler</option>
                <option value="auth-cormen|Thomas H. Cormen">Thomas H. Cormen</option>
                <option value="auth-clear|James Clear">James Clear</option>
                <option value="auth-orwell|George Orwell">George Orwell</option>
              </select>
            </div>

            <div class="form-group">
              <label for="book-category" class="form-label">Category *</label>
              <select id="book-category" class="form-select" required>
                <option value="cat-prog|Programming">Programming</option>
                <option value="cat-cs|Computer Science">Computer Science</option>
                <option value="cat-bus|Business">Business</option>
                <option value="cat-fic|Fiction">Fiction</option>
                <option value="cat-med|Medical">Medical</option>
                <option value="cat-math|Mathematics">Mathematics</option>
                <option value="cat-sci|Science">Science</option>
                <option value="cat-hist|History">History</option>
              </select>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="book-publisher" class="form-label">Publisher *</label>
              <select id="book-publisher" class="form-select" required>
                <option value="pub-prentice|Prentice Hall">Prentice Hall</option>
                <option value="pub-oreilly|O'Reilly Media">O'Reilly Media</option>
                <option value="pub-mit|MIT Press">MIT Press</option>
                <option value="pub-penguin|Penguin Random House">Penguin Random House</option>
              </select>
            </div>

            <div class="form-group">
              <label for="book-isbn" class="form-label">ISBN-13 Code *</label>
              <input type="text" id="book-isbn" class="form-input" placeholder="9780132350884" required>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="book-price" class="form-label">Regular Price (PKR) *</label>
              <input type="number" step="0.01" id="book-price" class="form-input" placeholder="49.99" required>
            </div>

            <div class="form-group">
              <label for="book-discount-price" class="form-label">Discount Price (PKR)</label>
              <input type="number" step="0.01" id="book-discount-price" class="form-input" placeholder="39.99">
            </div>

            <div class="form-group">
              <label for="book-stock" class="form-label">Stock Quantity *</label>
              <input type="number" id="book-stock" class="form-input" placeholder="25" required>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;">
            <div class="form-group">
              <label for="book-pages" class="form-label">Page Count</label>
              <input type="number" id="book-pages" class="form-input" placeholder="464">
            </div>

            <div class="form-group">
              <label for="book-lang" class="form-label">Language</label>
              <input type="text" id="book-lang" class="form-input" value="English">
            </div>

            <div class="form-group">
              <label for="book-year" class="form-label">Publication Year</label>
              <input type="number" id="book-year" class="form-input" value="2023">
            </div>
          </div>

          <div class="form-group">
            <label for="book-cover-file" class="form-label">Cover Image File (Firebase Cloud Storage Upload)</label>
            <input type="file" id="book-cover-file" accept="image/*" class="form-input">
          </div>

          <button type="submit" id="save-book-btn" class="btn btn-lg btn-primary" style="width:100%;margin-top:1rem;">
            Save Book Record
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/admin/admin-auth.js"></script>

  <script type="module">
    import { saveAdminBook } from "/js/admin/books.js";

    const form = document.getElementById("admin-book-form");
    const saveBtn = document.getElementById("save-book-btn");

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();

      const [authorId, authorName] = document.getElementById("book-author").value.split("|");
      const [categoryId, categoryName] = document.getElementById("book-category").value.split("|");
      const [publisherId, publisherName] = document.getElementById("book-publisher").value.split("|");

      const coverFileInput = document.getElementById("book-cover-file");
      const coverFile = coverFileInput?.files[0] || null;

      const formData = {
        title: document.getElementById("book-title").value,
        description: document.getElementById("book-description").value,
        authorId, authorName,
        categoryId, categoryName,
        publisherId, publisherName,
        isbn: document.getElementById("book-isbn").value,
        price: document.getElementById("book-price").value,
        discountPrice: document.getElementById("book-discount-price").value,
        stock: document.getElementById("book-stock").value,
        pages: document.getElementById("book-pages").value,
        language: document.getElementById("book-lang").value,
        publicationYear: document.getElementById("book-year").value
      };

      saveBtn.disabled = true;
      saveBtn.textContent = "Uploading & Saving...";

      const success = await saveAdminBook(formData, coverFile, null);
      if (success) {
        setTimeout(() => {
          window.location.href = "/admin/books.html";
        }, 800);
      } else {
        saveBtn.disabled = false;
        saveBtn.textContent = "Save Book Record";
      }
    });
  </script>
</body>
</html>

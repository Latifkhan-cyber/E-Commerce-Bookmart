<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Order Details - BookMart</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/account.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">📚 Book<span>Mart</span> Admin</div>
      <ul class="admin-menu-list">
        <li><a href="/admin/index.html" class="admin-menu-item">📊 Dashboard</a></li>
        <li><a href="/admin/books.html" class="admin-menu-item">📖 Books Catalog</a></li>
        <li><a href="/admin/orders.html" class="admin-menu-item active">📦 Customer Orders</a></li>
        <li><a href="/admin/customers.html" class="admin-menu-item">👥 Customer Accounts</a></li>
        <li><a href="/admin/inventory.html" class="admin-menu-item">⚠️ Stock Inventory</a></li>
        <li><a href="/admin/coupons.html" class="admin-menu-item">🏷️ Promo Coupons</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-top-bar">
        <div>
          <h1 style="font-size:1.8rem;margin-bottom:0.25rem;">Order Management & Details</h1>
          <p style="color:var(--text-muted);">Inspect order breakdown, change delivery status, or manage payment.</p>
        </div>
        <div style="display:flex;gap:0.75rem;">
          <button onclick="window.print()" class="btn btn-outline">🖨️ Print Invoice</button>
          <a href="/admin/orders.html" class="btn btn-primary">← Back to Orders</a>
        </div>
      </div>

      <!-- Main Order Container -->
      <div id="admin-order-details-container">
        <div style="padding: 3rem; text-align: center;">
          <div class="skeleton" style="width: 100%; height: 350px; border-radius: var(--radius-lg);"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/admin/admin-auth.js"></script>

  <script type="module">
    import { fetchOrderById } from "/js/orders.js";
    import { formatCurrency, formatDate, showToast } from "/js/utils.js";
    import { doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { db } from "/js/firebase-config.js";

    const urlParams = new URLSearchParams(window.location.search);
    const orderId = urlParams.get("id");

    const container = document.getElementById("admin-order-details-container");

    if (!orderId) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>No Order Specified</h3>
          <a href="/admin/orders.html" class="btn btn-primary">View All Orders</a>
        </div>
      `;
    } else {
      fetchOrderById(orderId).then(order => {
        if (!order) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">🔍</div>
              <h3>Order #${orderId} Not Found</h3>
              <p>Could not locate order in database records.</p>
              <a href="/admin/orders.html" class="btn btn-primary">Back to Orders</a>
            </div>
          `;
          return;
        }

        const steps = ["Pending", "Confirmed", "Processing", "Shipped", "Delivered"];
        const currentStatus = order.orderStatus || "Pending";
        const currentStepIdx = steps.indexOf(currentStatus) > -1 ? steps.indexOf(currentStatus) : 0;

        container.innerHTML = `
          <div style="background-color: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius-lg); padding: 2.5rem; margin-bottom: 2rem;">
            
            <!-- Order Header & Status Controls -->
            <div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:1.5rem;margin-bottom:2rem;border-bottom:1px solid var(--card-border);flex-wrap:wrap;gap:1.5rem;">
              <div>
                <span class="badge badge-info" style="margin-bottom:0.5rem;">Order Management</span>
                <h2 style="font-size: 2rem; margin-bottom: 0.35rem;">Order #${order.orderId || order.id}</h2>
                <div style="font-size:0.9rem;color:var(--text-muted);">
                  Customer: <strong style="color:var(--text-main);">${order.customerName || 'Customer'}</strong> (${order.customerEmail || 'No email'}) • Date: ${formatDate(order.createdAt)}
                </div>
              </div>

              <!-- Quick Status Controls -->
              <div style="display:flex;gap:1.25rem;background:var(--border-light);padding:1rem 1.25rem;border-radius:var(--radius-md);align-items:center;flex-wrap:wrap;">
                <div>
                  <label style="font-size:0.8rem;font-weight:700;display:block;margin-bottom:0.25rem;color:var(--text-muted);">Order Status:</label>
                  <select id="admin-change-order-status" class="form-select" style="padding:0.4rem 0.75rem;font-size:0.9rem;font-weight:700;">
                    <option value="Pending" ${currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                    <option value="Confirmed" ${currentStatus === 'Confirmed' ? 'selected' : ''}>Confirmed</option>
                    <option value="Processing" ${currentStatus === 'Processing' ? 'selected' : ''}>Processing</option>
                    <option value="Shipped" ${currentStatus === 'Shipped' ? 'selected' : ''}>Shipped</option>
                    <option value="Delivered" ${currentStatus === 'Delivered' ? 'selected' : ''}>Delivered</option>
                    <option value="Cancelled" ${currentStatus === 'Cancelled' ? 'selected' : ''}>Cancelled</option>
                  </select>
                </div>

                <div>
                  <label style="font-size:0.8rem;font-weight:700;display:block;margin-bottom:0.25rem;color:var(--text-muted);">Payment Status:</label>
                  <select id="admin-change-payment-status" class="form-select" style="padding:0.4rem 0.75rem;font-size:0.9rem;font-weight:700;">
                    <option value="Pending" ${order.paymentStatus === 'Pending' ? 'selected' : ''}>Pending (COD)</option>
                    <option value="Paid" ${order.paymentStatus === 'Paid' ? 'selected' : ''}>Paid</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Stepper Progress Preview -->
            ${currentStatus === 'Cancelled' ? `
              <div class="empty-state" style="padding:1.5rem;background:rgba(239, 68, 68, 0.05);border-color:var(--danger-color);margin-bottom:2.5rem;">
                <h3 style="color:var(--danger-color);margin-bottom:0;">Order Cancelled</h3>
              </div>
            ` : `
              <div style="margin-bottom:3rem;">
                <h3 style="font-size:1.1rem;margin-bottom:1.5rem;">Live Delivery Progress</h3>
                <div class="tracking-timeline">
                  ${steps.map((step, idx) => {
                    const isCompleted = idx < currentStepIdx;
                    const isActive = idx === currentStepIdx;
                    return `
                      <div class="timeline-step ${isCompleted ? 'completed' : isActive ? 'active' : ''}">
                        <div class="step-icon">${isCompleted ? '✓' : idx + 1}</div>
                        <div style="font-size:0.85rem;font-weight:${isActive || isCompleted ? '700' : '500'};color:${isActive ? 'var(--secondary-color)' : isCompleted ? 'var(--accent-color)' : 'var(--text-muted)'};">${step}</div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            `}

            <!-- Items & Breakdown Grid -->
            <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:2.5rem;">
              <!-- Items List -->
              <div>
                <h3 style="font-size:1.15rem;margin-bottom:1rem;">Ordered Books</h3>
                <div class="cart-table-wrap">
                  <table class="cart-table">
                    <thead>
                      <tr>
                        <th>Book</th>
                        <th>Qty</th>
                        <th>Unit Price</th>
                        <th>Subtotal</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${(order.items || []).map(item => `
                        <tr>
                          <td>
                            <div class="cart-item-info">
                              <img src="${item.coverImage}" alt="${item.title}" class="cart-item-img">
                              <div>
                                <a href="/book-details.html?id=${item.bookId}" target="_blank" class="cart-item-title">${item.title}</a>
                                <div class="cart-item-author">by ${item.authorName || 'Author'}</div>
                              </div>
                            </div>
                          </td>
                          <td style="font-weight:700;">${item.quantity}</td>
                          <td>${formatCurrency(item.price)}</td>
                          <td style="font-weight:700;color:var(--primary-color);">${formatCurrency(item.price * item.quantity)}</td>
                        </tr>
                      `).join('')}
                    </tbody>
                  </table>
                </div>
              </div>

              <!-- Shipping & Payment Info -->
              <div>
                <h3 style="font-size:1.15rem;margin-bottom:1rem;">Customer & Shipping Address</h3>
                <div style="background:var(--border-light);padding:1.5rem;border-radius:var(--radius-md);margin-bottom:1.5rem;">
                  <div style="font-weight:700;font-size:1rem;margin-bottom:0.5rem;">${order.shippingAddress?.fullName || order.customerName}</div>
                  <div style="font-size:0.9rem;color:var(--text-muted);line-height:1.6;">
                    ${order.shippingAddress?.address || 'Street Address'}<br>
                    ${order.shippingAddress?.city || ''}, ${order.shippingAddress?.province || ''} ${order.shippingAddress?.postalCode || ''}<br>
                    📞 Phone: <strong>${order.shippingAddress?.phone || 'N/A'}</strong><br>
                    ✉️ Email: <strong>${order.customerEmail || 'N/A'}</strong>
                  </div>
                </div>

                <div style="background:var(--card-bg);border:1px solid var(--card-border);padding:1.5rem;border-radius:var(--radius-md);">
                  <h4 style="margin-bottom:1rem;">Payment Breakdown</h4>
                  <div class="summary-row"><span>Items Subtotal:</span> <span>${formatCurrency(order.subtotal)}</span></div>
                  <div class="summary-row"><span>Shipping Fee:</span> <span>${order.shippingFee === 0 ? 'FREE' : formatCurrency(order.shippingFee)}</span></div>
                  ${order.discount ? `<div class="summary-row" style="color:var(--accent-color);"><span>Discount (${order.couponCode || 'Promo'}):</span> <span>-${formatCurrency(order.discount)}</span></div>` : ''}
                  <div class="summary-row total" style="margin-bottom:0;padding-top:0.75rem;"><span>Total Amount:</span> <span>${formatCurrency(order.total)}</span></div>
                </div>
              </div>
            </div>

          </div>
        `;

        // Event Listeners for Status Updates
        document.getElementById("admin-change-order-status")?.addEventListener("change", async (e) => {
          const newStatus = e.target.value;
          try {
            await updateDoc(doc(db, "orders", order.id || orderId), {
              orderStatus: newStatus,
              updatedAt: serverTimestamp()
            });
            showToast(`Order status updated to ${newStatus}!`, "success");
            setTimeout(() => location.reload(), 600);
          } catch (err) {
            console.error("Status update error:", err);
            showToast("Failed to update status in Firestore.", "error");
          }
        });

        document.getElementById("admin-change-payment-status")?.addEventListener("change", async (e) => {
          const newPayStatus = e.target.value;
          try {
            await updateDoc(doc(db, "orders", order.id || orderId), {
              paymentStatus: newPayStatus,
              updatedAt: serverTimestamp()
            });
            showToast(`Payment status updated to ${newPayStatus}!`, "success");
          } catch (err) {
            console.error("Payment status update error:", err);
            showToast("Failed to update payment status.", "error");
          }
        });
      });
    }
  </script>
</body>
</html>

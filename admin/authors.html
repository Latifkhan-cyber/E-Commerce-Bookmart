<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Authors - BookMart</title>
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="admin-logo">📚 Book<span>Mart</span> Admin</div>
      <ul class="admin-menu-list">
        <li><a href="/admin/index.html" class="admin-menu-item">📊 Dashboard</a></li>
        <li><a href="/admin/books.html" class="admin-menu-item">📖 Books Catalog</a></li>
        <li><a href="/admin/categories.html" class="admin-menu-item">📂 Categories</a></li>
        <li><a href="/admin/authors.html" class="admin-menu-item active">✍️ Authors</a></li>
        <li><a href="/admin/publishers.html" class="admin-menu-item">🏢 Publishers</a></li>
        <li><a href="/admin/orders.html" class="admin-menu-item">📦 Customer Orders</a></li>
      </ul>
    </aside>

    <main class="admin-main">
      <div class="admin-top-bar">
        <div>
          <h1 style="font-size:1.8rem;margin-bottom:0.25rem;">Author Management</h1>
          <p style="color:var(--text-muted);">Manage author profiles and biographies.</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1.2fr 0.8fr;gap:2rem;">
        <div class="data-table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Photo</th>
                <th>Author Name</th>
                <th>Biography</th>
                <th>Works</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="admin-authors-table-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>

        <div style="background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);padding:2rem;height:fit-content;">
          <h3 style="margin-bottom:1.25rem;">Add New Author</h3>
          <form id="add-author-form">
            <div class="form-group">
              <label for="auth-name" class="form-label">Author Name *</label>
              <input type="text" id="auth-name" class="form-input" placeholder="e.g. Donald Knuth" required>
            </div>
            <div class="form-group">
              <label for="auth-bio" class="form-label">Biography *</label>
              <textarea id="auth-bio" class="form-textarea" rows="3" placeholder="Author background & achievements..." required></textarea>
            </div>
            <div class="form-group">
              <label for="auth-img" class="form-label">Author Photo URL</label>
              <input type="url" id="auth-img" class="form-input" placeholder="https://images.unsplash.com/...">
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save Author</button>
          </form>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/admin/admin-auth.js"></script>

  <script type="module">
    import { renderAdminAuthorsTable, saveAdminAuthor } from "/js/admin/authors.js";

    renderAdminAuthorsTable();

    document.getElementById("add-author-form")?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("auth-name").value;
      const bio = document.getElementById("auth-bio").value;
      const img = document.getElementById("auth-img").value;

      const success = await saveAdminAuthor(name, bio, img);
      if (success) {
        document.getElementById("add-author-form").reset();
        renderAdminAuthorsTable();
      }
    });
  </script>
</body>
</html>

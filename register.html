<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - BookMart</title>
  <meta name="description" content="Register a new customer account at BookMart for easy book shopping, order tracking, and exclusive bookstore discounts.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card" style="max-width:480px;">
        <div class="auth-header">
          <h2>Join BookMart</h2>
          <p>Create your customer account to start shopping</p>
        </div>

        <form id="register-form">
          <div class="form-group">
            <label for="reg-name" class="form-label">Full Name</label>
            <input type="text" id="reg-name" class="form-input" placeholder="John Doe" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="reg-email" class="form-label">Email Address</label>
            <input type="email" id="reg-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="reg-phone" class="form-label">Phone Number (Optional)</label>
            <input type="tel" id="reg-phone" class="form-input" placeholder="+1 (555) 000-0000" autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="reg-password" class="form-label">Password</label>
            <div class="password-input-group">
              <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" required autocomplete="new-password">
              <button type="button" class="password-toggle" id="toggle-reg-password">👁️</button>
            </div>
          </div>

          <div class="form-group">
            <label for="reg-confirm-password" class="form-label">Confirm Password</label>
            <input type="password" id="reg-confirm-password" class="form-input" placeholder="Repeat your password" required autocomplete="new-password">
          </div>

          <button type="submit" id="register-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:1rem;">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login.html">Sign In</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { registerUser, onAuthChange } from "/js/auth.js";
    import { showToast } from "/js/utils.js";

    // Password Toggle
    const toggleBtn = document.getElementById("toggle-reg-password");
    const pwdInput = document.getElementById("reg-password");
    toggleBtn?.addEventListener("click", () => {
      const type = pwdInput.getAttribute("type") === "password" ? "text" : "password";
      pwdInput.setAttribute("type", type);
      toggleBtn.textContent = type === "password" ? "👁️" : "🙈";
    });

    const regForm = document.getElementById("register-form");
    const regBtn = document.getElementById("register-btn");

    regForm?.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const phone = document.getElementById("reg-phone").value;
      const password = document.getElementById("reg-password").value;
      const confirmPassword = document.getElementById("reg-confirm-password").value;

      if (password !== confirmPassword) {
        showToast("Passwords do not match!", "warning");
        return;
      }

      if (password.length < 6) {
        showToast("Password must be at least 6 characters long.", "warning");
        return;
      }

      regBtn.disabled = true;
      regBtn.innerHTML = `<span>Creating account...</span>`;

      try {
        await registerUser(name, email, phone, password);
        setTimeout(() => {
          window.location.href = "/account.html";
        }, 800);
      } catch (err) {
        regBtn.disabled = false;
        regBtn.innerHTML = `Create Account`;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - BookMart</title>
  <meta name="description" content="Log in to your BookMart customer account to manage orders, wishlist, and track purchases.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Sign in to your BookMart account</p>
        </div>

        <form id="login-form">
          <div class="form-group">
            <label for="login-email" class="form-label">Email Address</label>
            <input type="email" id="login-email" class="form-input" placeholder="name@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.4rem;">
              <label for="login-password" class="form-label" style="margin-bottom:0;">Password</label>
              <a href="/forgot-password.html" style="font-size:0.85rem;color:var(--secondary-color);font-weight:500;">Forgot Password?</a>
            </div>
            <div class="password-input-group">
              <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle" id="toggle-password" aria-label="Toggle password visibility">👁️</button>
            </div>
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-lg" style="width:100%;margin-top:1rem;">
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="/register.html">Create an Account</a>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>
  
  <script type="module">
    import { loginUser, onAuthChange } from "/js/auth.js";
    import { showToast } from "/js/utils.js";

    // Redirect if already logged in
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect") || "/account.html";

    onAuthChange((user, profile) => {
      if (user && profile) {
        window.location.href = redirectUrl;
      }
    });

    // Password Toggle
    const toggleBtn = document.getElementById("toggle-password");
    const pwdInput = document.getElementById("login-password");
    toggleBtn?.addEventListener("click", () => {
      const type = pwdInput.getAttribute("type") === "password" ? "text" : "password";
      pwdInput.setAttribute("type", type);
      toggleBtn.textContent = type === "password" ? "👁️" : "🙈";
    });

    // Login Form Submission
    const loginForm = document.getElementById("login-form");
    const loginBtn = document.getElementById("login-btn");

    loginForm?.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const password = document.getElementById("login-password").value;

      loginBtn.disabled = true;
      loginBtn.innerHTML = `<span>Signing in...</span>`;

      try {
        const profile = await loginUser(email, password);
        if (profile.role === "ADMIN") {
          window.location.href = redirectUrl.includes("admin") ? redirectUrl : "/admin/index.html";
        } else {
          window.location.href = redirectUrl;
        }
      } catch (err) {
        loginBtn.disabled = false;
        loginBtn.innerHTML = `Sign In`;
      }
    });
  </script>
</body>
</html>

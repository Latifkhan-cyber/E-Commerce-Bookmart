<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partner Publishers - BookMart</title>
  <meta name="description" content="Explore top educational and academic publishers partner with BookMart.">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/shop.css">
</head>
<body>

  <main class="main-content">
    <div class="container">
      <div style="margin-bottom: 2.5rem;">
        <span class="badge badge-success" style="margin-bottom:0.5rem;">Publishing Partners</span>
        <h1 style="margin-bottom: 0.5rem;">Official Publishers</h1>
        <p style="color: var(--text-muted); max-width: 600px;">
          BookMart collaborates with globally recognized publishing houses to bring you authentic, high-quality paperback and hardcover editions.
        </p>
      </div>

      <!-- Publishers Grid -->
      <div class="category-grid" id="publishers-grid-container" style="grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));">
        <!-- Dynamic Publisher Cards Loaded Here -->
      </div>
    </div>
  </main>

  <script type="module" src="/js/firebase-config.js"></script>
  <script type="module" src="/js/utils.js"></script>
  <script type="module" src="/js/navbar.js"></script>
  <script type="module" src="/js/footer.js"></script>

  <script type="module">
    import { renderPublisherGrid } from "/js/publishers.js";
    renderPublisherGrid("publishers-grid-container");
  </script>
</body>
</html>
